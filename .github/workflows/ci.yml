name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .

  week1:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {member: dat_vt, variant: 1}
          - {member: man_lpd, variant: 1}
          - {member: thinh_nq, variant: 3}
          - {member: tranquyetthang27, variant: 4}
          - {member: dang_lh, variant: 1}
          - {member: minh_vg, variant: 2}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q tests/test_w1.py --member ${{ matrix.member }} --variant ${{ matrix.variant }}

  week2:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        member: [dat_vt, minh_vg]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q tests/test_w2.py --member ${{ matrix.member }}

  week3:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        member: [dat_vt, man_lpd, thinh_nq, tranquyetthang27, dang_lh, minh_vg]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements-dev.txt
      # A member's job only runs the tests once their w3 folder is on the branch,
      # so one person's unfinished week does not turn everyone's PR red.
      - name: W3 instructor tests
        run: |
          if [ -d members/${{ matrix.member }}/w3 ]; then
            python -m pytest -q tests/test_w3.py --member ${{ matrix.member }}
          else
            echo "members/${{ matrix.member }}/w3 not created yet; skipping"
          fi

  study-planner-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements-dev.txt
      # T-W3: the planner must run from a fresh clone. Skipped until __main__.py exists.
      - name: Run the planner on the sample CSV
        run: |
          if [ -f shared/study_planner/__main__.py ]; then
            python -m shared.study_planner samples/tasks.csv --hours 2
          else
            echo "shared/study_planner/__main__.py not created yet; skipping"
          fi

  student-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q members/minh_vg/w1/test_exercises.py members/minh_vg/w2/tests_for_thang.py student_tests
